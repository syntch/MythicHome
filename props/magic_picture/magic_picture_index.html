<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magic Portrait</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; background: #000; }
    body, html { width: 100%; height: 100%; overflow: hidden; cursor: none; }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease-in-out;
    }
    #video-idle { z-index: 1; opacity: 1; }
    #video-react { z-index: 2; opacity: 0; pointer-events: none; }
  </style>
  <!-- Load the MQTT WebSockets Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <video id="video-idle" src="serena_idle.mp4" autoplay loop muted playsinline></video>
  <video id="video-react" src="serena_wave.mp4" preload="auto" muted playsinline></video>

  <script>
    const idleVid = document.getElementById('video-idle');
    const reactVid = document.getElementById('video-react');
    let isReacting = false;

    // --- Video Logic ---
    function triggerReaction() {
      if (isReacting) return;
      isReacting = true;

      reactVid.currentTime = 0;
      reactVid.play().then(() => {
        reactVid.style.opacity = '1';
      }).catch(err => {
        console.error("Playback error:", err);
        isReacting = false;
      });
    }

    reactVid.addEventListener('ended', () => {
      reactVid.style.opacity = '0';
      setTimeout(() => { isReacting = false; }, 300);
    });

    // --- MQTT Logic ---
    // Change this to your HA IP address. Port 1884 is the default WebSocket port for Mosquitto
    const brokerIP = "<YOUR_HOME_ASSISTANT_IP>"; 
    const brokerPort = 1884; 
    
    // Create a random client ID
    const client = new Paho.MQTT.Client(brokerIP, brokerPort, "Portrait_" + parseInt(Math.random() * 100, 10));

    client.onConnectionLost = function(responseObject) {
      console.log("MQTT Connection Lost: " + responseObject.errorMessage);
      // Auto-reconnect after 5 seconds
      setTimeout(connectMQTT, 5000);
    };

    client.onMessageArrived = function(message) {
      console.log("Received spell: " + message.destinationName);
      
      // Trigger the reaction if the wand casts the specific spell 
      // (You can change 'wave' to whatever topic you plan to use)
      if (message.destinationName.endsWith("wave") || message.destinationName.endsWith("fireball")) {
        triggerReaction();
      }
    };

    function connectMQTT() {
      console.log("Connecting to MQTT...");
      client.connect({
        userName: "<YOUR_MQTT_USERNAME>", // Replace with your MQTT username
        password: "<YOUR_MQTT_PASSWORD>", // Replace with your MQTT password
        onSuccess: function() {
          console.log("MQTT Connected!");
          // Listen to the wand topics
          client.subscribe("mythichome/events/cast/#");
        },
        onFailure: function(message) {
          console.log("MQTT Connection failed: " + message.errorMessage);
          setTimeout(connectMQTT, 5000);
        }
      });
    }

    // Start the connection
    connectMQTT();
  </script>
</body>
</html>
