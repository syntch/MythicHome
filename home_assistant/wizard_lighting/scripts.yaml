# ------------------------------------------------------------------------------
# PART 2: BATTLE SPELLBOOK EQUIP SCRIPTS (FOR CAVERN DRAGON BOSS FIGHT)
# ------------------------------------------------------------------------------
# Publishes the active spell to Unity over MQTT ("mythichome/player/spell_select")
# and tints the bedside table lamp to match the elemental energy loaded into the wand!

equip_spell_fireball:
  alias: "Spellbook: Equip Fireball"
  description: "Loads Fireball into the wand for the Unity Cavern Dragon battle and glows flame orange."
  icon: mdi:fire-circle
  mode: restart
  sequence:
    - action: mqtt.publish
      data:
        topic: mythichome/player/spell_select
        payload: "fireball"
        retain: true
    - action: light.turn_on
      target:
        entity_id: light.nightstand_bulb
      data:
        rgb_color: [255, 70, 0]
        brightness_pct: 80
        transition: 0.4

