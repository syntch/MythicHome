# ==============================================================================
# MythicHome: Wizard Lighting Fantasy Scene & Battle Spellbook Scripts
# ==============================================================================
# Paste these into your Home Assistant scripts.yaml or add each via:
# Settings -> Automations & Scenes -> Scripts -> Add Script (Edit in YAML)
#
# Bulbs Targeted:
# - Standing Lamp: light.standing_lamp_bulb_1 & light.standing_lamp_bulb_2
# - Bedside Lamp: light.nightstand_bulb
# ==============================================================================

# ------------------------------------------------------------------------------
# PART 1: ROOM AMBIENT FANTASY SCENES
# ------------------------------------------------------------------------------

wizard_scene_cave:
  alias: "Wizard Scene: Torchlit Cave"
  description: "Dim deep stone cavern lighting with a crackling warm torch on the bedside table."
  icon: mdi:fire
  mode: restart
  sequence:
    # 1. Set Standing Lamps to Dim Midnight Stone
    - action: light.turn_on
      target:
        entity_id:
          - light.standing_lamp_bulb_1
          - light.standing_lamp_bulb_2
      data:
        rgb_color: [15, 25, 70]
        brightness_pct: 15
        transition: 2

    # 2. Dynamic Torch Ignition & Flicker Sequence on Bedside Lamp
    - action: light.turn_on
      target:
        entity_id: light.nightstand_bulb
      data:
        rgb_color: [255, 90, 0]
        brightness_pct: 45
        transition: 0.1
    - delay:
        milliseconds: 120

    - action: light.turn_on
      target:
        entity_id: light.nightstand_bulb
      data:
        rgb_color: [200, 40, 0]
        brightness_pct: 25
        transition: 0.1
    - delay:
        milliseconds: 100

    - action: light.turn_on
      target:
        entity_id: light.nightstand_bulb
      data:
        rgb_color: [255, 140, 20]
        brightness_pct: 75
        transition: 0.15
    - delay:
        milliseconds: 150

    # 3. Settle on Steady Crackling Torch Flame
    - action: light.turn_on
      target:
        entity_id: light.nightstand_bulb
      data:
        rgb_color: [255, 120, 10]
        brightness_pct: 65
        transition: 0.8

