# ==============================================================================
# MythicHome: "Wizard Lighting & Battle Spellbook" Phone Dashboard
# ==============================================================================
# How to apply in Home Assistant:
# 1. Go to Dashboards -> Select your "Wizard Lighting" Dashboard.
# 2. Click the 3 dots in the top right -> "Edit Dashboard".
# 3. Click the 3 dots again -> "Raw configuration editor".
# 4. Paste the YAML below and click "Save".
# ==============================================================================

title: "Wizard Lighting"
views:
  # ============================================================================
  # TAB 1: ROOM AMBIENT FANTASY SCENES
  # ============================================================================
  - title: "Room Scenes"
    path: "spells"
    icon: mdi:wand
    type: sections
    max_columns: 2
    sections:
      - title: "🪄 Fantasy Environments"
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              # --- 1. Torchlit Cave ---
              - type: button
                name: "Torchlit Cave"
                icon: mdi:fire
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_cave
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(255,120,10,0.2), rgba(15,25,70,0.4));
                      border: 1px solid rgba(255,120,10,0.5);
                    }

              # --- 2. Poison Swamp ---
              - type: button
                name: "Poison Swamp"
                icon: mdi:flask-round-poison
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_swamp
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(30,200,30,0.2), rgba(180,0,255,0.2));
                      border: 1px solid rgba(30,200,30,0.5);
                    }

              # --- 3. Enchanted Forest ---
              - type: button
                name: "Enchanted Forest"
                icon: mdi:forest
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_forest
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(0,130,45,0.25), rgba(255,215,100,0.2));
                      border: 1px solid rgba(0,130,45,0.5);
                    }

              # --- 4. Dragon's Caldera ---
              - type: button
                name: "Dragon's Caldera"
                icon: mdi:volcano
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_dragon
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(200,15,0,0.25), rgba(255,180,0,0.2));
                      border: 1px solid rgba(200,15,0,0.5);
                    }

              # --- 5. Crystal Sanctum ---
              - type: button
                name: "Crystal Sanctum"
                icon: mdi:crystal-ball
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_sanctum
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(40,10,180,0.25), rgba(0,230,255,0.2));
                      border: 1px solid rgba(0,230,255,0.5);
                    }

              # --- 6. Normal Reading / Lumos ---
              - type: button
                name: "Lumos (Daylight)"
                icon: mdi:lightbulb-on
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_lumos
                  haptic: medium

              # --- 7. Nox (Sleep / Embers) ---
              - type: button
                name: "Nox (Sleep)"
                icon: mdi:weather-night
                show_name: true
                show_icon: true
                icon_height: 48px
                tap_action:
                  action: perform-action
                  perform_action: script.wizard_scene_nox
                  haptic: medium

      - title: "💡 Manual Lamp Adjustments"
        cards:
          - type: tile
            entity: light.nightstand_bulb
            name: "Bedside Lamp"
            icon: mdi:lamp
            features:
              - type: light-brightness

          - type: tile
            entity: light.standing_lamp_bulb_1
            name: "Standing Lamp (Upper)"
            icon: mdi:floor-lamp-torchiere
            features:
              - type: light-brightness

          - type: tile
            entity: light.standing_lamp_bulb_2
            name: "Standing Lamp (Lower)"
            icon: mdi:floor-lamp-torchiere-outline
            features:
              - type: light-brightness

  # ============================================================================
  # TAB 2: BATTLE SPELLBOOK (CAVERN DRAGON BOSS ENCOUNTER)
  # ============================================================================
  - title: "Battle Spellbook"
    path: "spellbook"
    icon: mdi:book-open-page-variant
    type: sections
    max_columns: 2
    sections:
      - title: "⚔️ Tap to Load Spell into Wand"
        cards:
          - type: markdown
            content: >
              **Cavern Dragon Combat:** Tap a spell below to load it into your wand, then **flick your MagiQuest wand** at the sensor!
              * Use **❄️ Ice Spear** when the Dragon casts its Flame Armor.
              * Use **🛡️ Arcane Shield** when the Dragon winds up its breath attack!

          - type: grid
            columns: 2
            square: false
            cards:
              # --- Spell 1: Fireball ---
              - type: button
                name: "🔥 Fireball (Heavy DMG)"
                icon: mdi:fire-circle
                show_name: true
                show_icon: true
                icon_height: 56px
                tap_action:
                  action: perform-action
                  perform_action: script.equip_spell_fireball
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(255,70,0,0.35), rgba(180,20,0,0.25));
                      border: 2px solid rgba(255,100,0,0.8);
                    }

              # --- Spell 2: Lightning Bolt ---
              - type: button
                name: "⚡ Lightning (Fast Strike)"
                icon: mdi:flash
                show_name: true
                show_icon: true
                icon_height: 56px
                tap_action:
                  action: perform-action
                  perform_action: script.equip_spell_lightning
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(255,230,0,0.3), rgba(100,120,0,0.25));
                      border: 2px solid rgba(255,230,0,0.8);
                    }

              # --- Spell 3: Ice Spear (Shield Breaker) ---
              - type: button
                name: "❄️ Ice Spear (Break Shield)"
                icon: mdi:snowflake
                show_name: true
                show_icon: true
                icon_height: 56px
                tap_action:
                  action: perform-action
                  perform_action: script.equip_spell_ice_spear
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(0,225,255,0.35), rgba(0,80,180,0.3));
                      border: 2px solid rgba(0,225,255,0.9);
                    }

              # --- Spell 4: Arcane Shield (Defense) ---
              - type: button
                name: "🛡️ Arcane Shield (Block)"
                icon: mdi:shield-sun
                show_name: true
                show_icon: true
                icon_height: 56px
                tap_action:
                  action: perform-action
                  perform_action: script.equip_spell_shield
                  haptic: heavy
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(50,255,130,0.35), rgba(0,120,60,0.3));
                      border: 2px solid rgba(50,255,130,0.9);
                    }
